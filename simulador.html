<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador y Monitor - Yape Notificador</title>
    <!-- Estilos modernos y limpios -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #7b1fa2; /* Color estilo Yape */
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        button {
            background-color: #00c853;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #00b0ff;
        }
        .pago-item {
            background: #fafafa;
            border-left: 4px solid #00c853;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pago-info h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }
        .pago-info span {
            font-size: 12px;
            color: #86868b;
        }
        .pago-monto {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
        }
        .status {
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
            color: #666;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 12px 0 6px;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 15px;
        }
        .route {
            margin: 14px 0 0;
            padding: 10px;
            border-radius: 8px;
            background: #f5f0f7;
            color: #632074;
            font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🟣 Simulador Yape Notificador</h1>
        <div id="status" class="status">Conectando a Firebase...</div>

        <!-- Panel para simular un pago manual -->
        <div class="card">
            <h3>Prueba de conexión</h3>
            <p style="font-size: 14px; color: #555;">Envía un pago de prueba a la misma ruta que consulta la aplicación principal.</p>
            <label for="codigoCaja">Identificador de caja</label>
            <input id="codigoCaja" type="text" value="DEFAULT" placeholder="Ej.: CAJA-LOCAL-01">
            <label for="fechaPago">Fecha</label>
            <input id="fechaPago" type="date">
            <p id="rutaFirebase" class="route"></p>
            <button onclick="enviarPagoPrueba()">Simular pago de S/ 25.50</button>
        </div>

        <!-- Historial en tiempo real -->
        <div class="card">
            <h3>Pagos recibidos en tiempo real</h3>
            <div id="listaPagos">
                <p style="color: #999; text-align: center;">Esperando pagos...</p>
            </div>
        </div>
    </div>

    <!-- SDKs de Firebase (Versión compatible web modular/compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Configuración conectada directamente a tu proyecto de Firebase
        const firebaseConfig = {
            databaseURL: "https://yapenotificador-default-rtdb.firebaseio.com"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const statusDiv = document.getElementById("status");
        const listaPagosDiv = document.getElementById("listaPagos");
        const codigoCajaInput = document.getElementById("codigoCaja");
        const fechaPagoInput = document.getElementById("fechaPago");
        const rutaFirebase = document.getElementById("rutaFirebase");
        let pagosRef = null;

        const hoy = new Date();
        const fechaLocal = new Date(hoy.getTime() - hoy.getTimezoneOffset() * 60000)
            .toISOString()
            .split("T")[0];
        fechaPagoInput.value = fechaLocal;

        function obtenerRutaPagos() {
            const codigoCaja = codigoCajaInput.value.trim() || "DEFAULT";
            return `yapes/${codigoCaja}/${fechaPagoInput.value}`;
        }

        function mostrarPago(data) {
            if (listaPagosDiv.querySelector("p")) listaPagosDiv.innerHTML = "";

            const nombre = data.nombre || "Cliente de Prueba";
            const monto = Number(data.monto ?? data.amount ?? data.valor ?? 0);
            const fecha = data.fecha ? new Date(data.fecha) : new Date();
            const item = document.createElement("div");
            item.className = "pago-item";

            const info = document.createElement("div");
            info.className = "pago-info";
            const titulo = document.createElement("h4");
            titulo.textContent = nombre;
            const hora = document.createElement("span");
            hora.textContent = fecha.toLocaleTimeString();
            info.append(titulo, hora);

            const montoDiv = document.createElement("div");
            montoDiv.className = "pago-monto";
            montoDiv.textContent = `S/ ${monto.toFixed(2)}`;
            item.append(info, montoDiv);
            listaPagosDiv.prepend(item);
        }

        function escucharPagos() {
            if (!fechaPagoInput.value) return;
            if (pagosRef) pagosRef.off("child_added");

            const ruta = obtenerRutaPagos();
            rutaFirebase.textContent = `Ruta de prueba: ${ruta}`;
            listaPagosDiv.innerHTML = '<p style="color: #999; text-align: center;">Esperando pagos...</p>';
            pagosRef = db.ref(ruta);
            pagosRef.on("child_added", (snapshot) => mostrarPago(snapshot.val() || {}));
        }

        codigoCajaInput.addEventListener("change", escucharPagos);
        fechaPagoInput.addEventListener("change", escucharPagos);

        // Monitorear estado de conexión con Firebase
        db.ref(".info/connected").on("value", function(snapshot) {
            if (snapshot.val() === true) {
                statusDiv.innerHTML = "✅ Conectado exitosamente a Firebase";
                statusDiv.style.color = "green";
            } else {
                statusDiv.innerHTML = "⚠️ Desconectado o reconectando...";
                statusDiv.style.color = "orange";
            }
        });

        // Función para inyectar un pago de prueba manualmente
        function enviarPagoPrueba() {
            const nuevoPago = {
                nombre: "Usuario Simulador Web",
                monto: "25.50",
                fecha: Date.now()
            };

            if (!pagosRef) return;

            pagosRef.push(nuevoPago)
                .then(() => {
                    alert("¡Pago simulado enviado con éxito a Firebase!");
                })
                .catch((error) => {
                    alert("Error al enviar: " + error.message);
                });
        }

        escucharPagos();
    </script>
</body>
</html>
